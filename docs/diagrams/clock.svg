<svg viewBox="0 0 790 200" role="img" aria-label="The client pings the phone and gets the phone's receive and send times back; from four timestamps it works out the clock offset and the round trip." xmlns="http://www.w3.org/2000/svg"><defs><marker id="a-clock" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-tip"/></marker><marker id="a-clock-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-tip-accent"/></marker></defs><text x="20" y="54" class="dg-title">Your computer</text><text x="20" y="164" class="dg-title">Phone</text><line x1="140" y1="50" x2="700" y2="50" class="dg-axis" marker-end="url(#a-clock)"/><line x1="140" y1="160" x2="700" y2="160" class="dg-axis" marker-end="url(#a-clock)"/><circle cx="200" cy="50" r="4" class="dg-dot"/><text x="200" y="34" class="dg-mono" text-anchor="middle">t0</text><circle cx="330" cy="160" r="4" class="dg-dot"/><text x="330" y="182" class="dg-mono" text-anchor="middle">t1</text><circle cx="380" cy="160" r="4" class="dg-dot"/><text x="380" y="182" class="dg-mono" text-anchor="middle">t2</text><circle cx="510" cy="50" r="4" class="dg-dot"/><text x="510" y="34" class="dg-mono" text-anchor="middle">t3</text><line x1="200" y1="54" x2="326" y2="156" class="dg-arrow dg-accent" marker-end="url(#a-clock-o)"/><text x="250" y="118" class="dg-label" text-anchor="end">ping</text><line x1="380" y1="156" x2="506" y2="54" class="dg-arrow dg-accent" marker-end="url(#a-clock-o)"/><text x="460" y="118" class="dg-label">pong: t1, t2</text><text x="545" y="96" class="dg-label">offset = ((t1−t0) + (t2−t3)) / 2</text><text x="545" y="114" class="dg-label">round trip = (t3−t0) − (t2−t1)</text></svg>
