<svg viewBox="0 0 910 400" role="img" aria-label="Sources feed one engine; the engine feeds every link, gated per link by Sharing; each link speaks its own protocol to its clients." xmlns="http://www.w3.org/2000/svg"><defs><marker id="a-overview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-tip"/></marker><marker id="a-overview-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-tip-accent"/></marker></defs><rect x="10" y="20" width="640" height="372" rx="20" class="dg-frame"/><text x="30" y="44" class="dg-title">Phone · AllSense app</text><text x="30" y="72" class="dg-head" text-anchor="start">SOURCES</text><rect x="30" y="84" width="140" height="46" rx="10" class="dg-box"/><text x="44" y="104.0" class="dg-title" text-anchor="start">Motion sensors</text><text x="44" y="120.0" class="dg-sub" text-anchor="start">IMU, compass, baro</text><line x1="170" y1="107" x2="206" y2="107" class="dg-arrow" marker-end="url(#a-overview)"/><rect x="30" y="142" width="140" height="46" rx="10" class="dg-box"/><text x="44" y="162.0" class="dg-title" text-anchor="start">Location, radios</text><text x="44" y="178.0" class="dg-sub" text-anchor="start">GNSS, Wi-Fi, cell</text><line x1="170" y1="165" x2="206" y2="165" class="dg-arrow" marker-end="url(#a-overview)"/><rect x="30" y="200" width="140" height="46" rx="10" class="dg-box"/><text x="44" y="220.0" class="dg-title" text-anchor="start">Battery</text><text x="44" y="236.0" class="dg-sub" text-anchor="start">level, charging</text><line x1="170" y1="223" x2="206" y2="223" class="dg-arrow" marker-end="url(#a-overview)"/><rect x="30" y="258" width="140" height="46" rx="10" class="dg-box"/><text x="44" y="278.0" class="dg-title" text-anchor="start">Cameras</text><text x="44" y="294.0" class="dg-sub" text-anchor="start">every lens</text><line x1="170" y1="281" x2="206" y2="281" class="dg-arrow" marker-end="url(#a-overview)"/><rect x="30" y="316" width="140" height="46" rx="10" class="dg-box"/><text x="44" y="336.0" class="dg-title" text-anchor="start">Microphones</text><text x="44" y="352.0" class="dg-sub" text-anchor="start">every input</text><line x1="170" y1="339" x2="206" y2="339" class="dg-arrow" marker-end="url(#a-overview)"/><text x="210" y="72" class="dg-head" text-anchor="start">ENGINE</text><rect x="210" y="84" width="170" height="278" rx="12" class="dg-box"/><rect x="222" y="96" width="146" height="54" rx="10" class="dg-inner"/><text x="236" y="120.0" class="dg-title" text-anchor="start">SensorHub</text><text x="236" y="136.0" class="dg-sub" text-anchor="start">runs only while read</text><rect x="222" y="162" width="146" height="54" rx="10" class="dg-inner"/><text x="236" y="186.0" class="dg-title" text-anchor="start">Camera / MicHub</text><text x="236" y="202.0" class="dg-sub" text-anchor="start">one capture, shared</text><rect x="222" y="228" width="146" height="54" rx="10" class="dg-inner"/><text x="236" y="252.0" class="dg-title" text-anchor="start">Decimator</text><text x="236" y="268.0" class="dg-sub" text-anchor="start">each reader, own rate</text><rect x="222" y="294" width="146" height="54" rx="10" class="dg-inner"/><text x="236" y="318.0" class="dg-title" text-anchor="start">Processors</text><text x="236" y="334.0" class="dg-sub" text-anchor="start">mount, AprilTags</text><line x1="405" y1="80" x2="405" y2="372" class="dg-gate"/><text x="398" y="72" class="dg-head dg-accent-text" text-anchor="end">SHARING</text><text x="405" y="386" class="dg-label dg-accent-text" text-anchor="middle">per link</text><text x="430" y="72" class="dg-head" text-anchor="start">LINKS</text><line x1="380" y1="107" x2="426" y2="107" class="dg-arrow" marker-end="url(#a-overview)"/><rect x="430" y="84" width="150" height="46" rx="10" class="dg-box"/><text x="444" y="104.0" class="dg-title" text-anchor="start">WebSocket</text><text x="444" y="120.0" class="dg-sub" text-anchor="start">+ HTTP video, audio</text><line x1="580" y1="107" x2="690" y2="107" class="dg-arrow" marker-end="url(#a-overview)"/><text x="635.0" y="101" class="dg-label" text-anchor="middle">JSON</text><rect x="694" y="84" width="206" height="46" rx="10" class="dg-box"/><text x="708" y="104.0" class="dg-title" text-anchor="start">Browser, Python, ROS 2</text><text x="708" y="120.0" class="dg-sub" text-anchor="start">Wi-Fi, hotspot, USB</text><line x1="380" y1="165" x2="426" y2="165" class="dg-arrow" marker-end="url(#a-overview)"/><rect x="430" y="142" width="150" height="46" rx="10" class="dg-box"/><text x="444" y="169.0" class="dg-title" text-anchor="start">USB serial</text><line x1="580" y1="165" x2="690" y2="165" class="dg-arrow" marker-end="url(#a-overview)"/><text x="635.0" y="159" class="dg-label" text-anchor="middle">compact</text><rect x="694" y="142" width="206" height="46" rx="10" class="dg-box"/><text x="708" y="162.0" class="dg-title" text-anchor="start">Arduino, ESP32, Pico</text><text x="708" y="178.0" class="dg-sub" text-anchor="start">a USB cable</text><line x1="380" y1="223" x2="426" y2="223" class="dg-arrow" marker-end="url(#a-overview)"/><rect x="430" y="200" width="150" height="46" rx="10" class="dg-box"/><text x="444" y="227.0" class="dg-title" text-anchor="start">Bluetooth LE</text><line x1="580" y1="223" x2="690" y2="223" class="dg-arrow" marker-end="url(#a-overview)"/><text x="635.0" y="217" class="dg-label" text-anchor="middle">compact</text><rect x="694" y="200" width="206" height="46" rx="10" class="dg-box"/><text x="708" y="220.0" class="dg-title" text-anchor="start">ESP32</text><text x="708" y="236.0" class="dg-sub" text-anchor="start">Bluetooth LE</text><line x1="380" y1="281" x2="426" y2="281" class="dg-arrow" marker-end="url(#a-overview)"/><rect x="430" y="258" width="150" height="46" rx="10" class="dg-box"/><text x="444" y="285.0" class="dg-title" text-anchor="start">MQTT</text><line x1="580" y1="281" x2="690" y2="281" class="dg-arrow" marker-end="url(#a-overview)"/><text x="635.0" y="275" class="dg-label" text-anchor="middle">JSON</text><rect x="694" y="258" width="206" height="46" rx="10" class="dg-box"/><text x="708" y="278.0" class="dg-title" text-anchor="start">MQTT broker</text><text x="708" y="294.0" class="dg-sub" text-anchor="start">Home Assistant, cloud</text><line x1="380" y1="339" x2="426" y2="339" class="dg-arrow" marker-end="url(#a-overview)"/><rect x="430" y="316" width="150" height="46" rx="10" class="dg-box"/><text x="444" y="336.0" class="dg-title" text-anchor="start">Recorder</text><text x="444" y="352.0" class="dg-sub" text-anchor="start">on the phone</text><line x1="580" y1="339" x2="690" y2="339" class="dg-arrow" marker-end="url(#a-overview)"/><text x="635.0" y="333" class="dg-label" text-anchor="middle">CSV</text><rect x="694" y="316" width="206" height="46" rx="10" class="dg-box"/><text x="708" y="336.0" class="dg-title" text-anchor="start">Files</text><text x="708" y="352.0" class="dg-sub" text-anchor="start">CSV, MCAP: share later</text><text x="694" y="72" class="dg-head" text-anchor="start">CLIENTS</text></svg>
