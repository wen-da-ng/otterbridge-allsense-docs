name: CI

# Pull requests: build only. Pushes to main: build, then publish to GitHub Pages
# (https://docs.allsense.otterbridge.org/, custom domain set in Settings → Pages).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Every package pinned and hash-checked (tools/docs-requirements.txt, generated from docs-requirements.in).
      - run: pip install --require-hashes -r tools/docs-requirements.txt
      # Fails on broken links, missing pages and missing included files (pymdownx.snippets check_paths).
      - run: mkdocs build --strict
      # The theme ships source maps (its own open-source code); drop them and the lines that point to them.
      - run: |
          find site -name '*.map' -delete
          find site \( -name '*.js' -o -name '*.css' \) -exec sed -i '/sourceMappingURL=/d' {} +
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true   # v4+ drops dotfiles by default; keep v3's behaviour

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
