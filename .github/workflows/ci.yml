name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/docs-requirements.txt
      # Fails on broken links, missing pages and missing included files (pymdownx.snippets check_paths).
      - run: mkdocs build --strict
